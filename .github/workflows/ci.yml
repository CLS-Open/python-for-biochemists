name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"     # weekly: catch library drift and dead DOIs

permissions:
  contents: read

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: python -m pytest -q --cov=kinetics --cov-report=term-missing
      - name: Doctests, once per hash seed (dict/set order must not leak into output)
        run: |
          for seed in 1 2 3; do
            PYTHONHASHSEED=$seed python -m pytest -q --doctest-modules src/kinetics
          done

  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned range, not a version: the lint rules that matter here are stable, and a
      # teaching repository should not fail on a Wednesday because a new rule shipped.
      - run: python -m pip install --upgrade pip && pip install "ruff>=0.6,<1"
      - run: ruff check .
      - run: ruff format --check .

  notebooks:
    name: execute every notebook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ipykernel lives in the dev extra: nbconvert cannot start a kernel without it.
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" nbconvert
      - name: Execute from the repository root
        run: |
          for nb in notebooks/*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute --stdout "$nb" > /dev/null
            echo "::endgroup::"
          done
      - name: Execute from elsewhere (notebooks must not assume a working directory)
        run: |
          cd /tmp
          for nb in "$GITHUB_WORKSPACE"/notebooks/*.ipynb; do
            jupyter nbconvert --to notebook --execute --stdout "$nb" > /dev/null
          done
      - name: Committed outputs match a fresh execution
        run: python scripts/check_notebooks.py

  figures:
    name: figures reproduce from data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Verify the committed PNGs and figure_values.json against a fresh build
        run: python scripts/make_figures.py --check
      - name: Determinism across hash seeds
        run: |
          for seed in 1 2 3; do
            PYTHONHASHSEED=$seed python scripts/make_figures.py --check
          done

  data-and-links:
    name: data metadata, links, citation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" cffconvert
      - run: python scripts/check_data_metadata.py
      - run: python scripts/check_docs_links.py
      - name: Citation file is valid
        run: cffconvert --validate
      - name: The documented defects of the QC dataset are still exactly those
        run: python -m pytest -q tests/test_datasets.py

  cross-validation:
    name: cross-validate against SciPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e .
      - run: python scripts/validate_against_scipy.py

  references:
    name: DOIs resolve and match their titles
    # Not on pull requests: an offline contributor should not be blocked by Crossref's uptime.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_references.py

  docs:
    name: docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install mkdocs-material pymdown-extensions
      - run: NO_MKDOCS_2_WARNING=1 mkdocs build --strict
